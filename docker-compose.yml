services:
  backend:
    image: cr.lffl.me/lotteryeverysecond-backend:latest
    container_name: lottery-backend
    restart: unless-stopped
    ports:
      - "3350:3350"
    volumes:
      - ./data:/app/data
    environment:
      - DENO_ENV=production
      - DATABASE_PATH=/app/data/db.db
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: cr.lffl.me/lotteryeverysecond-frontend:latest
    container_name: lottery-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  data:
